name: Deploy to Railway

env:
  NEXT_TELEMETRY_DISABLED: 1

on:
  # Manual trigger — works from any branch via the Actions tab.
  workflow_dispatch:
    inputs:
      service:
        description: 'Railway service name (overrides the RAILWAY_SERVICE variable)'
        required: false
        type: string
  push:
    # The repo's default branch. Change this if the default ever moves.
    branches: ['claude/personal-finance-pwa-v3phel']

# Never let two deploys race to the same service.
concurrency:
  group: railway-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Railway rebuilds from source anyway, but failing here costs seconds
      # instead of shipping a broken build and waiting on a healthcheck timeout.
      - name: Verify the build before shipping it
        run: |
          npm run typecheck
          npm run test
          npm run build

      - name: Check RAILWAY_TOKEN is configured
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set. Add it under Settings -> Secrets and variables -> Actions, using a project token from the Railway project's Settings -> Tokens."
            exit 1
          fi
          echo "RAILWAY_TOKEN is present."

      - name: Install Railway CLI
        run: npm i -g @railway/cli@5

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ inputs.service || vars.RAILWAY_SERVICE }}
        run: |
          set -euo pipefail
          # A project token already scopes the deploy to one project and
          # environment, so --service is the only selector still needed --
          # and only when the project holds more than one service.
          if [ -n "${SERVICE:-}" ]; then
            railway up --ci --service "$SERVICE"
          else
            railway up --ci
          fi
